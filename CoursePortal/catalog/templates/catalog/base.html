<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DTI CoursePortal{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand navbar-dark bg-primary">
    <div class="container flex-wrap">
      <a class="navbar-brand fw-bold" href="{% url 'catalog:home' %}">DTI CoursePortal</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'catalog:home' %}">Home</a>
        <a class="nav-link" href="{% url 'catalog:course_list' %}">Courses</a>
        <a class="nav-link" href="{% url 'catalog:inquiry' %}">Submit Inquiry</a>
      </div>
    </div>
  </nav>
  <main class="container py-5 flex-grow-1">{% block content %}{% endblock %}</main>
  <footer class="bg-dark text-white text-center py-3">
    <small>Department of Information Technology · DTI412</small>
  </footer>
</body>
</html>
